[project]
name = "masking-ceiling"
version = "0.1.0"
description = "The ceiling of the real-mask class, and where a Gaussian mixture separator sits under it"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    # imported directly by the sweep and the calibration probes, not only through
    # gasm, so they are declared here rather than inherited
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # the thesis implementation itself, so what is measured is the reference code
    # rather than a copy of it
    "gasm @ git+https://github.com/mbaelde/generative-audio-source-models.git#subdirectory=python",
    "musdb>=0.4",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["mypy>=1.10"]
# its own group and not `dev`: `uv run` installs `dev` by default, so matplotlib
# in it would be downloaded into every fresh experiment container for nothing
figures = ["matplotlib>=3.8"]

[tool.mypy]
strict = true
files = ["experiments"]
